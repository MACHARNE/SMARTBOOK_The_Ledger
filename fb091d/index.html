<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Book — The Ledger</title>
<script>
  // A failed bundle load gets a useful message without exposing stack traces.
  window.addEventListener('load', function () {
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && !root.children.length) {
        var message = document.createElement('p');
        message.textContent = 'Smart Book could not load. Check your connection and reload.';
        message.setAttribute('role', 'alert'); root.appendChild(message);
      }
    }, 8000);
  });
</script>
<script src="/fb091d/storage-adapter.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>
<script>window.storage = null;</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/fb091d/app.js"></script>
</body>
</html>
