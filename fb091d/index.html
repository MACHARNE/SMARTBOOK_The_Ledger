<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Book — The Ledger</title>
<script>
  // On-page error catcher: shows any JavaScript error directly on screen,
  // in any browser, with no DevTools or computer needed. This is here
  // specifically so a crash can be diagnosed from a phone screenshot.
  (function () {
    var box = null;
    function ensureBox() {
      if (box) return box;
      box = document.createElement("div");
      box.id = "__error_overlay__";
      box.style.cssText =
        "position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;" +
        "background:#3a0f0f;color:#ffb4b4;font:12px/1.5 monospace;padding:12px;" +
        "z-index:999999;white-space:pre-wrap;border-top:3px solid #ff4d4d;";
      var heading = document.createElement("div");
      heading.textContent = "⚠ This page hit an error — screenshot this box and send it back.";
      heading.style.cssText = "color:#ffd6d6;font-weight:bold;margin-bottom:8px;font-family:sans-serif;";
      box.appendChild(heading);
      document.body.appendChild(box);
      return box;
    }
    function report(label, detail) {
      var b = ensureBox();
      var line = document.createElement("div");
      line.style.marginTop = "6px";
      line.textContent = "[" + label + "] " + detail;
      b.appendChild(line);
    }
    window.addEventListener("error", function (e) {
      var msg = e.message || "Unknown error";
      var where = e.filename ? (e.filename + ":" + e.lineno + ":" + e.colno) : "";
      report("Error", msg + (where ? "  (" + where + ")" : "") + (e.error && e.error.stack ? "\n" + e.error.stack : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      var reason = e.reason;
      var msg = reason && reason.message ? reason.message : String(reason);
      report("Unhandled Promise Rejection", msg + (reason && reason.stack ? "\n" + reason.stack : ""));
    });
    // If the app never mounts (e.g. the production app bundle failed to load),
    // say so plainly after a few seconds instead of staying silently blank.
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.children.length === 0 && !box) {
        report(
          "Nothing loaded",
          "The page stayed blank with no JavaScript error. This usually means the page could not load the built app bundle. Check the deployment assets and reload."
        );
      }
    }, 8000);
  })();
</script>
<script src="/fb091d/storage-adapter.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  #root { min-height: 100vh; }
</style>
<script>window.storage = null;</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/fb091d/app.js"></script>
</body>
</html>
